name: Build K Downloader v1.9 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK 35 & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip Project & Build Signed APK
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | sort -r | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Unzipping $ZIP_FILE..."
            unzip -o "$ZIP_FILE" -d ./extracted_project
          fi

          PROJECT_FILE=$(find . -maxdepth 4 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "Building Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          keytool -genkeypair -v \
            -keystore app/release.jks \
            -alias kdownloader_key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass KDownloader2026! \
            -keypass KDownloader2026! \
            -dname "CN=KDownloader, OU=Mobile, O=YEOMBROS, L=PhnomPenh, S=PP, C=KH"

          cat << 'EOF' >> app/build.gradle.kts

          android {
              lint {
                  checkReleaseBuilds = false
                  abortOnError = false
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("release.jks")
                      storePassword = "KDownloader2026!"
                      keyAlias = "kdownloader_key"
                      keyPassword = "KDownloader2026!"
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }
          }
          EOF

          gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload K Downloader v1.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: K-Downloader-v1.9-APK
          path: "**/build/outputs/apk/release/app-release.apk"
